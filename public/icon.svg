<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="afGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B4332" />
      <stop offset="50%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#081C15" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="120" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#F4A261" />
      <stop offset="100%" stop-color="#E76F51" />
    </linearGradient>
    <linearGradient id="limeGradient" x1="100" y1="100" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#AACC00" />
      <stop offset="100%" stop-color="#7CB518" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect width="512" height="512" rx="112" fill="url(#afGradient)" />
  
  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#7CB518" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Emblem Center Graphic: Pure Water Droplet & Fresh Leaf & Sunburst -->
  <g filter="url(#glow)">
    <!-- Water Drop Base -->
    <path d="M256 100 C256 100 150 240 150 320 C150 380 198 424 256 424 C314 424 362 380 362 320 C362 240 256 100 256 100 Z" 
          fill="url(#limeGradient)" fill-opacity="0.2" stroke="#7CB518" stroke-width="6"/>
          
    <!-- Stylized Wheat / Leaf Motif -->
    <path d="M256 130 C220 220 180 270 170 330 C210 320 240 280 256 220 C272 280 302 320 342 330 C332 270 292 220 256 130 Z" 
          fill="url(#limeGradient)"/>
          
    <!-- Golden Core Droplet / Seed -->
    <path d="M256 240 C242 275 225 300 225 325 C225 342 239 355 256 355 C273 355 287 342 287 325 C287 300 270 275 256 240 Z" 
          fill="url(#goldGradient)"/>
  </g>

  <!-- Typography Monogram: AL FAROOQ -->
  <text x="256" y="445" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="4">AL FAROOQ</text>
  <text x="256" y="475" text-anchor="middle" fill="#AACC00" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="6">FOOD PRODUCTS</text>
</svg>
